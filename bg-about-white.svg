<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet">
<!-- WHO WE ARE = MANUFACTURER STORY : 3D milky-white factory + drum + flask + shield-check, ALL x<760, right half EMPTY -->
<defs>
<linearGradient id="mw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9F1F8"/><stop offset="1" stop-color="#B9CBE0"/></linearGradient>
<linearGradient id="mwD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE7F3"/><stop offset="1" stop-color="#8FA6C2"/></linearGradient>
<linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BD9C0"/><stop offset="1" stop-color="#128C6B"/></linearGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<g fill="url(#sh)" opacity=".55"><ellipse cx="380" cy="530" rx="300" ry="22"/></g>
<!-- 3D factory block -->
<g>
<polygon points="140,300 260,260 260,470 140,510" fill="url(#mwD)"/>
<polygon points="260,260 420,260 420,470 260,470" fill="url(#mw)"/>
<polygon points="140,300 260,260 420,260 300,300" fill="#FFFFFF"/>
<rect x="285" y="300" width="40" height="50" fill="url(#mwD)"/>
<rect x="340" y="300" width="40" height="50" fill="url(#mwD)"/>
<rect x="285" y="375" width="95" height="40" fill="url(#liq)" opacity=".8"/>
<rect x="170" y="200" width="22" height="90" fill="url(#mw)"/>
<rect x="330" y="180" width="26" height="95" fill="url(#mw)"/>
<circle cx="181" cy="192" r="10" fill="#7BD9C0"/>
<circle cx="343" cy="172" r="11" fill="#7BD9C0"/>
</g>
<!-- 3D chemical drum foreground -->
<g>
<ellipse cx="540" cy="470" rx="75" ry="22" fill="url(#mwD)"/>
<rect x="465" y="330" width="150" height="140" fill="url(#mw)"/>
<ellipse cx="540" cy="330" rx="75" ry="22" fill="#FFFFFF"/>
<ellipse cx="540" cy="330" rx="55" ry="15" fill="url(#mwD)"/>
<rect x="465" y="375" width="150" height="20" fill="url(#liq)" opacity=".9"/>
<rect x="465" y="415" width="150" height="12" fill="#8FA6C2" opacity=".7"/>
<rect x="520" y="300" width="40" height="22" rx="4" fill="url(#mw)" stroke="#8FA6C2" stroke-width="2"/>
</g>
<!-- 3D flask behind drum -->
<g>
<path d="M610 180l60 110a44 44 0 0 1-39 66h-42a44 44 0 0 1-39-66l60-110z" fill="url(#mw)" stroke="#8FA6C2" stroke-width="3"/>
<path d="M622 300l24 44a28 28 0 0 1-25 42h-42a28 28 0 0 1-25-42l24-44z" fill="url(#liq)" opacity=".85"/>
<rect x="600" y="158" width="20" height="26" rx="4" fill="#FFFFFF" stroke="#8FA6C2" stroke-width="3"/>
</g>
<!-- shield-check badge : documented quality -->
<g>
<path d="M150 330l60 22 60-22v-70c0-30-25-55-60-68-35 13-60 38-60 68z" fill="url(#mw)" stroke="#7BD9C0" stroke-width="5"/>
<path d="M188 278l22 24 36-40" fill="none" stroke="#128C6B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<rect x="90" y="505" width="610" height="16" rx="8" fill="#FFFFFF" opacity=".9"/>
</svg>
