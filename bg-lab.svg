<rect x="584" y="300" width="82" height="34" rx="6" fill="#FFFFFF" opacity=".95"/>
<rect x="592" y="308" width="50" height="8" rx="4" fill="#128C6B"/>
<rect x="592" y="320" width="66" height="6" rx="3" fill="#8FA6C2"/>
