<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet">
<!-- PRODUCTS = QC LAB CATALOGUE : 3D milky-white flasks + reagent bottle + test tubes, ALL x<760, right half EMPTY -->
<defs>
<linearGradient id="mw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9F1F8"/><stop offset="1" stop-color="#B9CBE0"/></linearGradient>
<linearGradient id="mwD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE7F3"/><stop offset="1" stop-color="#8FA6C2"/></linearGradient>
