<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet">
<!-- HOME = CHEMICAL MANUFACTURING PLANT : 3D-projected milky-white reactors+columns+tank, ALL x<760, right half EMPTY -->
<defs>
<linearGradient id="mw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9F1F8"/><stop offset="1" stop-color="#B9CBE0"/></linearGradient>
<linearGradient id="mwD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE7F3"/><stop offset="1" stop-color="#8FA6C2"/></linearGradient>
<linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BD9C0"/><stop offset="1" stop-color="#128C6B"/></linearGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<!-- ground shadows -->
<g fill="url(#sh)" opacity=".55"><ellipse cx="330" cy="528" rx="250" ry="22"/><ellipse cx="560" cy="500" rx="150" ry="14"/></g>
<!-- back distillation column (3D: front face + side face + top ellipse) -->
<g>
<polygon points="150,150 196,132 196,470 150,492" fill="url(#mwD)"/>
<polygon points="196,132 246,150 246,488 196,470" fill="url(#mw)"/>
<ellipse cx="198" cy="141" rx="48" ry="14" fill="#FFFFFF"/>
<ellipse cx="198" cy="141" rx="30" ry="8" fill="#C9D9EA"/>
<rect x="196" y="220" width="50" height="14" fill="url(#liq)" opacity=".85"/>
<rect x="196" y="300" width="50" height="14" fill="url(#liq)" opacity=".6"/>
<rect x="196" y="380" width="50" height="14" fill="url(#liq)" opacity=".4"/>
</g>
<!-- front tall column -->
<g>
<polygon points="300,110 352,90 352,450 300,472" fill="url(#mwD)"/>
<polygon points="352,90 406,110 406,472 352,450" fill="url(#mw)"/>
<ellipse cx="353" cy="100" rx="53" ry="15" fill="#FFFFFF"/>
<ellipse cx="353" cy="100" rx="33" ry="9" fill="#DCE7F3"/>
<rect x="352" y="190" width="54" height="16" fill="url(#liq)"/>
<rect x="352" y="270" width="54" height="16" fill="url(#liq)" opacity=".7"/>
<rect x="352" y="350" width="54" height="16" fill="url(#liq)" opacity=".45"/>
<rect x="330" y="60" width="46" height="34" fill="url(#mw)" stroke="#8FA6C2" stroke-width="2"/>
</g>
<!-- connecting pipe bridge -->
<g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity=".9"><path d="M246 220h70M406 250h60"/></g>
<g fill="none" stroke="#7BD9C0" stroke-width="5" opacity=".9"><path d="M246 220h70M406 250h60"/></g>
<!-- horizontal reactor vessel 3D -->
<g>
<ellipse cx="560" cy="430" rx="120" ry="60" fill="url(#mw)"/>
<rect x="440" y="330" width="240" height="100" fill="url(#mw)"/>
<ellipse cx="560" cy="330" rx="120" ry="34" fill="#FFFFFF"/>
<ellipse cx="560" cy="330" rx="92" ry="24" fill="url(#mwD)"/>
<rect x="448" y="368" width="224" height="26" rx="13" fill="url(#liq)" opacity=".9"/>
<polygon points="470,430 486,470 502,430" fill="#8FA6C2"/>
<polygon points="618,430 634,470 650,430" fill="#8FA6C2"/>
<path d="M500 300v-40M560 295v-45M620 300v-40" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
</g>
<!-- rising bubbles -->
<g fill="#FFFFFF" opacity=".85"><circle cx="560" cy="210" r="9"/><circle cx="592" cy="170" r="7"/><circle cx="622" cy="128" r="5"/><circle cx="250" cy="80" r="6"/></g>
<!-- base platform -->
<rect x="90" y="500" width="620" height="16" rx="8" fill="#FFFFFF" opacity=".9"/>
</svg>
