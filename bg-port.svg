<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid meet">
<!-- CONTACT = EXPORT DESK / PORT DISPATCH : 3D milky-white container ship + containers + envelope, ALL x<760, right half EMPTY -->
<defs>
<linearGradient id="mw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#E9F1F8"/><stop offset="1" stop-color="#B9CBE0"/></linearGradient>
<linearGradient id="mwD" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE7F3"/><stop offset="1" stop-color="#8FA6C2"/></linearGradient>
<linearGradient id="liq" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BD9C0"/><stop offset="1" stop-color="#128C6B"/></linearGradient>
<radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".45"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
</defs>
<g fill="url(#sh)" opacity=".5"><ellipse cx="380" cy="520" rx="300" ry="20"/></g>
<!-- stacked 3D containers -->
<g>
<polygon points="150,300 190,282 330,282 290,300" fill="#FFFFFF"/>
<rect x="150" y="300" width="140" height="60" fill="url(#mw)"/>
<rect x="190" y="282" width="140" height="60" fill="url(#mwD)"/>
<line x1="170" y1="300" x2="170" y2="360" stroke="#8FA6C2" stroke-width="2" opacity=".7"/>
<line x1="195" y1="300" x2="195" y2="360" stroke="#8FA6C2" stroke-width="2" opacity=".7"/>
<line x1="220" y1="300" x2="220" y2="360" stroke="#8FA6C2" stroke-width="2" opacity=".7"/>
<polygon points="300,240 340,222 480,222 440,240" fill="#FFFFFF"/>
<rect x="300" y="240" width="140" height="60" fill="url(#liq)"/>
<rect x="340" y="222" width="140" height="60" fill="#0E7A5C"/>
<rect x="300" y="360" width="140" height="55" fill="url(#mw)" stroke="#8FA6C2" stroke-width="2"/>
<rect x="440" y="360" width="140" height="55" fill="url(#mwD)" stroke="#8FA6C2" stroke-width="2"/>
</g>
<!-- 3D hull foreground -->
<g>
<polygon points="110,430 660,430 610,490 160,490" fill="url(#mw)"/>
<polygon points="110,430 660,430 650,448 120,448" fill="#FFFFFF"/>
<rect x="120" y="448" width="530" height="12" fill="url(#liq)"/>
<path d="M330 430v-55h70l-14 55" fill="url(#mwD)" stroke="#8FA6C2" stroke-width="3"/>
<rect x="340" y="362" width="50" height="18" fill="#FFFFFF" stroke="#8FA6C2" stroke-width="2"/>
</g>
<!-- 3D envelope : email enquiry -->
<g>
<polygon points="480,300 520,282 660,282 620,300" fill="#FFFFFF"/>
<rect x="480" y="300" width="140" height="95" rx="8" fill="url(#mw)"/>
<polygon points="480,308 550,360 620,308 620,322 550,374 480,322" fill="url(#mwD)"/>
<rect x="480" y="282" width="140" height="20" rx="8" fill="#7BD9C0"/>
</g>
<rect x="90" y="502" width="620" height="14" rx="7" fill="#FFFFFF" opacity=".85"/>
</svg>
